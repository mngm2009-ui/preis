<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد ملصقات نجوم ماركت - نظام زيبرا المزدوج</title>
    <!-- مكتبة قراءة الإكسل و CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- مكتبة توليد الباركود JsBarcode -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-print-color-adjust: exact !important; 
            print-color-adjust: exact !important;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: var(--primary);
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="file"], input[type="number"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: #fff;
        }

        .dimensions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .three-cols {
            grid-template-columns: 1fr 1fr 1fr;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .btn-offer {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-offer:hover {
            background-color: #dc2626;
        }

        .info-box {
            background: #e0f2fe;
            color: #0369a1;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        #selectionContainer {
            display: none;
            margin-top: 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            background: #f8fafc;
        }
        
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 2px solid #cbd5e1;
        }

        #productList {
            max-height: 250px;
            overflow-y: auto;
            padding-left: 5px;
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5px;
            border-bottom: 1px solid #e2e8f0;
            transition: background 0.2s;
        }
        
        .product-item:hover {
            background: #e0e7ff;
        }

        .product-item label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            width: 100%;
            margin: 0;
            font-weight: normal;
        }

        .product-item input[type="checkbox"], #selectAllCheckbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        #printArea { display: none; }

        @media print {
            body { background-color: #ffffff; padding: 0; margin: 0; }
            .no-print { display: none !important; }
            #printArea { display: block !important; }
        }
    </style>
</head>
<body>

<div class="container no-print">
    <h1>مولد ملصقات نجوم ماركت (تحديث رول زيبرا المزدوج)</h1>
    
    <div class="info-box">
        <strong>خيارات زيبرا المتطورة:</strong><br>
        أضفنا خياراً ثالثاً يقوم بتوليد صفحة طولية (مثلاً 6×15 سم) تضع فيها بطاقتين متلاصقتين عمودياً، مع خط متقطع بينهما لسهولة القص.
    </div>

    <div class="form-group">
        <label for="excelFile">اختر ملف CSV أو Excel:</label>
        <input type="file" id="excelFile" accept=".xlsx, .xls, .csv">
    </div>

    <div class="dimensions-grid">
        <div class="form-group" style="grid-column: span 2;">
            <label>نوع الطباعة / التصدير:</label>
            <select id="printModeSelect" style="border-color: var(--primary); font-weight: bold; color: var(--primary);">
                <option value="a4" selected>ورق A4 (مجموعة ملصقات متلاصقة للقص)</option>
                <option value="zebra">طابعة زيبرا (ملصق واحد لكل صفحة PDF)</option>
                <option value="zebra_roll">طابعة زيبرا (رول 6×15 سم - بطاقتين بالطول)</option>
            </select>
        </div>
    </div>

    <div class="dimensions-grid three-cols">
        <div class="form-group">
            <label>مقاس البطاقة الواحدة:</label>
            <select id="cardSizeSelect">
                <option value="7,4.5" selected>الأساسي (7 × 4.5 سم)</option>
                <option value="6,7.5">نصف رول زيبرا (6 × 7.5 سم)</option>
                <option value="19,13.5">مقاس A5</option>
                <option value="9.5,13.5">مقاس A6</option>
                <option value="custom">مقاس مخصص</option>
            </select>
        </div>
        <div class="form-group">
            <label>عرض البطاقة (سم):</label>
            <input type="number" id="widthInput" value="7" step="0.1" min="2">
        </div>
        <div class="form-group">
            <label>ارتفاع البطاقة (سم):</label>
            <input type="number" id="heightInput" value="4.5" step="0.1" min="2">
        </div>
    </div>

    <div id="selectionContainer">
        <div class="list-header">
            <strong>اختر المنتجات للتصدير:</strong>
            <div style="display: flex; gap: 15px; align-items: center;">
                <button type="button" id="selectOffersBtn" class="btn-offer">تحديد العروض فقط</button>
                <label style="display:flex; align-items:center; gap:8px; cursor:pointer; color:var(--primary); font-weight:bold; margin:0;">
                    <input type="checkbox" id="selectAllCheckbox" checked>
                    تحديد الكل
                </label>
            </div>
        </div>
        <div id="productList"></div>
    </div>

    <button class="btn" id="generateBtn" disabled>توليد الملصقات / حفظ كـ PDF</button>
</div>

<div id="printArea"></div>

<script>
    let parsedExcelData = [];

    const cardSizeSelect = document.getElementById('cardSizeSelect');
    const widthInput = document.getElementById('widthInput');
    const heightInput = document.getElementById('heightInput');
    const printModeSelect = document.getElementById('printModeSelect');

    // عندما يتغير نوع الطباعة
    printModeSelect.addEventListener('change', (e) => {
        if (e.target.value === 'zebra_roll') {
            cardSizeSelect.value = "6,7.5";
            widthInput.value = 6;
            heightInput.value = 7.5; // ارتفاع البطاقتين 15، فالبطاقة الواحدة 7.5
        } else if (e.target.value === 'a4' || e.target.value === 'zebra') {
            cardSizeSelect.value = "7,4.5";
            widthInput.value = 7;
            heightInput.value = 4.5;
        }
    });

    cardSizeSelect.addEventListener('change', (e) => {
        if (e.target.value !== 'custom') {
            const dims = e.target.value.split(',');
            widthInput.value = dims[0];
            heightInput.value = dims[1];
        }
    });

    const excelFileInput = document.getElementById('excelFile');
    const generateBtn = document.getElementById('generateBtn');
    const selectAllCheckbox = document.getElementById('selectAllCheckbox');
    const selectOffersBtn = document.getElementById('selectOffersBtn');
    const selectionContainer = document.getElementById('selectionContainer');
    const productList = document.getElementById('productList');

    excelFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        const isCSV = file.name.toLowerCase().endsWith('.csv');

        reader.onload = function(e) {
            try {
                let workbook;
                if (isCSV) {
                    const text = e.target.result;
                    workbook = XLSX.read(text, { type: 'string' });
                } else {
                    const data = new Uint8Array(e.target.result);
                    workbook = XLSX.read(data, { type: 'array' });
                }
                
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                parsedExcelData = XLSX.utils.sheet_to_json(worksheet, { defval: "", raw: false });
                
                if (parsedExcelData.length === 0) {
                    alert('الملف فارغ أو غير صالح!');
                    selectionContainer.style.display = 'none';
                    generateBtn.disabled = true;
                    return;
                }

                renderProductList(parsedExcelData);

            } catch (err) {
                console.error(err);
                alert('حدث خطأ أثناء قراءة الملف.');
                selectionContainer.style.display = 'none';
                generateBtn.disabled = true;
            }
        };

        if (isCSV) {
            reader.readAsText(file, 'UTF-8');
        } else {
            reader.readAsArrayBuffer(file);
        }
    });

    function renderProductList(data) {
        productList.innerHTML = '';
        selectionContainer.style.display = 'block';
        generateBtn.disabled = false;
        selectAllCheckbox.checked = true;

        data.forEach((row, index) => {
            let name = row['Produkt'] || row['الاسم (عربي)'] || row['الاسم'] || row['name'] || `منتج غير معروف (${index + 1})`;
            let basePrice = row['Preis'] || row['السعر الأساسي'] || row['السعر'] || row['price'] || '';
            let offerPrice = row['سعر العرض'] || row['Offer Price'] || row['Angebotspreis'] || row['offer'] || '';
            
            let hasOffer = offerPrice !== undefined && offerPrice !== null && String(offerPrice).trim() !== "" && String(offerPrice).trim().toLowerCase() !== "nan";
            let displayPrice = hasOffer ? `<span style="text-decoration:line-through; color:#94a3b8; font-size:11px; margin-right:5px;">${basePrice}</span> <span style="color:#d32f2f;">${offerPrice} €</span>` : `<span style="color:#1e293b;">${basePrice} €</span>`;

            const item = document.createElement('div');
            item.className = 'product-item';
            item.innerHTML = `
                <label>
                    <input type="checkbox" class="product-cb" value="${index}" checked>
                    <span style="flex: 1; font-weight: bold; color: #1e293b;">${name}</span>
                    <span style="font-weight: bold;" dir="ltr">${displayPrice}</span>
                </label>
            `;
            productList.appendChild(item);
        });

        const checkboxes = document.querySelectorAll('.product-cb');
        checkboxes.forEach(cb => {
            cb.addEventListener('change', () => {
                const allChecked = document.querySelectorAll('.product-cb:checked').length === checkboxes.length;
                selectAllCheckbox.checked = allChecked;
            });
        });
    }

    selectAllCheckbox.addEventListener('change', (e) => {
        const checkboxes = document.querySelectorAll('.product-cb');
        checkboxes.forEach(cb => cb.checked = e.target.checked);
    });

    selectOffersBtn.addEventListener('click', () => {
        const checkboxes = document.querySelectorAll('.product-cb');
        let offerCount = 0;
        
        checkboxes.forEach(cb => {
            const index = cb.value;
            const row = parsedExcelData[index];
            let offerPriceRaw = row['سعر العرض'] || row['Offer Price'] || row['Angebotspreis'] || row['offer'] || '';
            
            const hasOffer = offerPriceRaw !== undefined && offerPriceRaw !== null && String(offerPriceRaw).trim() !== "" && String(offerPriceRaw).trim().toLowerCase() !== "nan";
            
            cb.checked = hasOffer;
            if (hasOffer) offerCount++;
        });
        
        selectAllCheckbox.checked = false;
        
        if (offerCount === 0) {
            alert("لا يوجد أي منتجات عليها عروض في هذا الملف!");
        }
    });

    function formatWeight(w) {
        if (!w) return '';
        let western = String(w).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
        const stkKeywords = ['ظرف', 'قطعه', 'قطعة', 'حبه', 'حبة', 'حبات', 'قطع', 'كيس', 'اكياس'];
        let isStuck = false;
        for (let i = 0; i < stkKeywords.length; i++) {
            if (western.includes(stkKeywords[i])) { isStuck = true; break; }
        }
        let numMatch = western.match(/[\d.,]+/);
        if (!numMatch) return western; 
        let num = numMatch[0];
        if (isStuck) return `${num} Stk`;
        
        let unit = 'g';
        let lower = western.toLowerCase();
        
        if (lower.includes('ml') || lower.includes('مل')) unit = 'ml';
        else if (lower.includes('l') || lower.includes('لتر') || lower.includes('ل')) unit = 'L';
        else if (lower.includes('kg') || lower.includes('كيلو') || lower.includes('كغ')) unit = 'kg';
        else if (lower.includes('g') || lower.includes('gr') || lower.includes('غرام') || lower.includes('جرام') || lower.includes('غ') || lower.includes('جر')) unit = 'g';
        
        return `${num} ${unit}`;
    }

    function cleanPriceVal(val) {
        if (val === undefined || val === null || val === '') return '';
        let cleaned = String(val).replace(/[^\d.,]/g, '').replace(',', '.');
        let num = parseFloat(cleaned);
        return isNaN(num) ? '' : num.toFixed(2).replace('.', ',');
    }

    function calculateGrundpreis(priceStr, weightStr) {
        if (!priceStr || !weightStr) return '';
        let cleanPrice = parseFloat(String(priceStr).replace(/[^\d.,]/g, '').replace(',', '.'));
        if (isNaN(cleanPrice) || cleanPrice === 0) return '';
        
        let wLower = String(weightStr).toLowerCase().trim();
        if (wLower.includes('stk')) return ''; 
        
        let numMatch = wLower.match(/([\d.,]+)/);
        if (!numMatch) return '';
        let val = parseFloat(numMatch[1].replace(',', '.'));
        if (isNaN(val) || val === 0) return '';
        
        let unit = '';
        if (wLower.includes('kg') || wLower.includes('كيلو')) unit = 'kg';
        else if (wLower.includes('g') || wLower.includes('gr') || wLower.includes('غ')) unit = 'g';
        else if (wLower.includes('ml') || wLower.includes('مل')) unit = 'ml';
        else if (wLower.includes('l') || wLower.includes('لتر')) unit = 'l';
        else return '';

        let totalKgOrL = 0;
        let targetUnit = 'Kg';
        
        if (unit === 'g') { totalKgOrL = val / 1000; targetUnit = 'Kg'; }
        else if (unit === 'kg') { totalKgOrL = val; targetUnit = 'Kg'; }
        else if (unit === 'ml') { totalKgOrL = val / 1000; targetUnit = 'L'; }
        else if (unit === 'l') { totalKgOrL = val; targetUnit = 'L'; }
        
        if (totalKgOrL > 0) {
            let grundPrice = (cleanPrice / totalKgOrL).toFixed(2);
            return `${grundPrice.replace('.', ',')} €/${targetUnit}`;
        }
        return '';
    }

    generateBtn.addEventListener('click', () => {
        const checkedBoxes = document.querySelectorAll('.product-cb:checked');
        const selectedData = Array.from(checkedBoxes).map(cb => parsedExcelData[cb.value]);

        if (selectedData.length === 0) {
            alert('الرجاء تحديد منتج واحد على الأقل للطباعة!');
            return;
        }

        const printMode = printModeSelect.value;
        const tw_cm = parseFloat(widthInput.value) || 7;
        const th_cm = parseFloat(heightInput.value) || 4.5;
        const tw = tw_cm * 10; 
        const th = th_cm * 10; 
        const fontScale = Math.min(tw_cm / 7, th_cm / 4.5);

        const styleId = "dynamic-print-style";
        let styleEl = document.getElementById(styleId);
        if (!styleEl) {
            styleEl = document.createElement('style');
            styleEl.id = styleId;
            document.head.appendChild(styleEl);
        }

        let cssString = '';

        if (printMode === 'a4') {
            const a4_w = 210; 
            const a4_h = 297; 
            const pageMargin = 5; 
            const usableW = a4_w - (pageMargin * 2);
            const usableH = a4_h - (pageMargin * 2);

            let cols = Math.floor(usableW / tw);
            let rows = Math.floor(usableH / th);
            if (cols < 1) cols = 1; 
            if (rows < 1) rows = 1;
            
            window.ticketsPerPage = cols * rows;

            cssString = `
                @media print {
                    @page { size: A4 portrait; margin: 0mm !important; }
                    body, html { width: 210mm !important; height: 297mm !important; margin: 0 !important; padding: 0 !important; }
                    .print-page {
                        width: 210mm !important; height: 297mm !important;
                        padding: ${pageMargin}mm !important; box-sizing: border-box !important;
                        display: grid !important; grid-template-columns: repeat(${cols}, ${tw}mm) !important;
                        grid-template-rows: repeat(${rows}, ${th}mm) !important; gap: 0mm !important; 
                        page-break-after: always !important; break-after: page !important;
                        align-content: start !important; justify-content: start !important;
                    }
                    .print-page:last-child { page-break-after: auto !important; break-after: auto !important; }
                    .ticket-box {
                        width: ${tw}mm !important; height: ${th}mm !important;
                        box-sizing: border-box !important; overflow: hidden !important;
                        border: 1px solid #000000 !important; display: flex !important;
                        flex-direction: column !important; justify-content: space-between !important;
                        padding: ${3 * fontScale}mm ${4 * fontScale}mm !important; background: #fff !important;
                    }
                }
            `;
        } else if (printMode === 'zebra_roll') {
            window.ticketsPerPage = 2; // بطاقتين بالطول
            const rollW = tw; 
            const rollH = th * 2; // الارتفاع الكلي للرول يساوي ارتفاع بطاقتين

            cssString = `
                @media print {
                    @page { size: ${rollW}mm ${rollH}mm; margin: 0mm !important; }
                    body, html { width: ${rollW}mm !important; height: ${rollH}mm !important; margin: 0 !important; padding: 0 !important; }
                    .print-page {
                        width: ${rollW}mm !important; height: ${rollH}mm !important;
                        box-sizing: border-box !important; margin: 0 !important; padding: 0 !important;
                        display: flex !important; flex-direction: column !important;
                        page-break-after: always !important; break-after: page !important;
                    }
                    .print-page:last-child { page-break-after: auto !important; break-after: auto !important; }
                    .ticket-box {
                        width: ${tw}mm !important; height: ${th}mm !important;
                        box-sizing: border-box !important; overflow: hidden !important;
                        border: none !important; border-bottom: 1px dashed #000 !important; /* خط وهمي للقص بينهما */
                        display: flex !important; flex-direction: column !important;
                        justify-content: space-between !important;
                        padding: ${3 * fontScale}mm ${4 * fontScale}mm !important; background: #fff !important;
                    }
                    .ticket-box:last-child { border-bottom: none !important; } /* لا خط في النهاية */
                }
            `;
        } else {
            // Zebra (بطاقة واحدة بالصفحة)
            window.ticketsPerPage = 1;

            cssString = `
                @media print {
                    @page { size: ${tw}mm ${th}mm; margin: 0mm !important; }
                    body, html { width: ${tw}mm !important; height: ${th}mm !important; margin: 0 !important; padding: 0 !important; }
                    .print-page {
                        width: ${tw}mm !important; height: ${th}mm !important;
                        box-sizing: border-box !important; margin: 0 !important; padding: 0 !important;
                        display: block !important; page-break-after: always !important; break-after: page !important;
                    }
                    .print-page:last-child { page-break-after: auto !important; break-after: auto !important; }
                    .ticket-box {
                        width: ${tw}mm !important; height: ${th}mm !important;
                        box-sizing: border-box !important; overflow: hidden !important;
                        border: none !important; display: flex !important;
                        flex-direction: column !important; justify-content: space-between !important;
                        padding: ${3 * fontScale}mm ${4 * fontScale}mm !important; background: #fff !important;
                    }
                }
            `;
        }

        styleEl.innerHTML = cssString;

        const printArea = document.getElementById('printArea');
        printArea.innerHTML = '';
        let currentPage = null;

        selectedData.forEach((row, index) => {
            if (index % window.ticketsPerPage === 0) {
                currentPage = document.createElement('div');
                currentPage.className = 'print-page';
                printArea.appendChild(currentPage);
            }

            let arabicName = row['Produkt'] || row['الاسم (عربي)'] || row['الاسم'] || row['name'] || '';
            let latinName = row['DE Name'] || row['de name'] || row['الاسم (ألماني/لاتيني)'] || row['Translated'] || '';
            let weightRaw = row['Beschreibung'] || row['الوزن'] || row['Unnamed: 4'] || '';
            let barcode = row['Barcode'] || row['الباركود'] || row['barcode'] || '';
            let basePriceRaw = row['Preis'] || row['السعر الأساسي'] || row['السعر'] || row['price'] || '';
            let offerPriceRaw = row['سعر العرض'] || row['Offer Price'] || row['Angebotspreis'] || row['offer'] || '';

            const weight = formatWeight(weightRaw);
            const hasOffer = offerPriceRaw !== undefined && offerPriceRaw !== null && String(offerPriceRaw).trim() !== "" && String(offerPriceRaw).trim().toLowerCase() !== "nan";
            const boxBgColor = hasOffer ? '#7f1d1d' : '#1e293b'; 
            
            const mainPriceNum = hasOffer ? cleanPriceVal(offerPriceRaw) : cleanPriceVal(basePriceRaw);
            const oldPriceNum = hasOffer ? cleanPriceVal(basePriceRaw) : '';
            const grundpreisText = calculateGrundpreis(mainPriceNum, weight);

            const ticketDiv = document.createElement('div');
            ticketDiv.className = 'ticket-box';

            let contentHTML = `
                <div style="display: flex; justify-content: space-between; align-items: flex-start; flex: 1; overflow: hidden; margin-bottom: ${3 * fontScale}px;">
                    <div style="font-weight: bold; color: #111; text-align: left; max-width: 65%;">
                        <div style="color: #111; direction: rtl; text-align: right; font-weight: bold; font-size: ${13 * fontScale}px; line-height: 1.1;">${arabicName}</div>
                        <div style="font-weight: bold; font-size: ${12 * fontScale}px; direction: ltr; text-align: left; line-height: 1.1; margin-top: 2px;">${latinName}</div>
                        <div style="font-size: ${11 * fontScale}px; color: #333; font-weight: bold; direction: ltr; text-align: left; margin-top: 2px;">${weight}</div>
                    </div>
                    
                    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">
                        <div style="background-color: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 3px; padding: ${2 * fontScale}px ${4 * fontScale}px; font-size: ${8 * fontScale}px; font-weight: bold; color: #334155; white-space: nowrap;">
                            Nogoom Markt
                        </div>
                        ${grundpreisText ? `<div style="font-size: ${9 * fontScale}px; color: #475569; font-weight: bold; direction: ltr; white-space: nowrap;">${grundpreisText}</div>` : ''}
                    </div>
                </div>

                <div style="position: relative; background-color: ${boxBgColor} !important; color: #ffffff !important; padding: 0; display: flex; justify-content: center; align-items: center; border-radius: 4px; flex: 0 0 calc(48px * ${fontScale}); height: calc(48px * ${fontScale}); overflow: hidden; -webkit-print-color-adjust: exact; print-color-adjust: exact;">
                    ${oldPriceNum ? `<div style="position: absolute; left: ${8 * fontScale}px; font-size: ${16 * fontScale}px; text-decoration: line-through; color: #fca5a5; font-weight: bold;" dir="ltr">${oldPriceNum} €</div>` : ''}
                    
                    <div style="font-size: ${48 * fontScale}px; font-weight: bold; letter-spacing: -1px; line-height: 1; color: #ffffff !important;" dir="ltr">
                        ${mainPriceNum ? `${mainPriceNum} <span style="font-size:${28 * fontScale}px; color: #ffffff !important;">€</span>` : ''}
                    </div>
                </div>

                <div style="display: flex; justify-content: center; align-items: center; flex: 0 0 auto; margin-top: ${3 * fontScale}px; height: ${24 * fontScale}px; overflow: hidden;">
                    <div style="width: 100%; display: flex; justify-content: center; align-items: center; height: 100%;">
                        <svg id="barcode-${index}" style="max-height: 100%; width: auto;"></svg>
                    </div>
                </div>
            `;
            
            ticketDiv.innerHTML = contentHTML;
            currentPage.appendChild(ticketDiv);

            setTimeout(() => {
                try {
                    if (barcode) {
                        JsBarcode(`#barcode-${index}`, String(barcode), {
                            format: "CODE128",
                            displayValue: true,
                            fontSize: 10 * fontScale,
                            height: 20 * fontScale,
                            margin: 0
                        });
                    }
                } catch (err) {
                    console.error("Barcode error:", err);
                }
            }, 100);
        });

        setTimeout(() => {
            window.print();
        }, 800);
    });
</script>

</body>
</html>
