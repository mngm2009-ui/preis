<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد ملصقات نجوم ماركت - التصدير المباشر</title>
    <!-- مكتبة قراءة الإكسل و CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- مكتبة توليد الباركود -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
    <!-- مكتبة توليد الـ PDF المباشر (تمنع تخريب المتصفح للمقاسات) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: var(--primary);
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="file"], input[type="number"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: #fff;
        }

        .dimensions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .btn-offer {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-offer:hover {
            background-color: #dc2626;
        }

        .info-box {
            background: #fff3cd;
            color: #856404;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.6;
            border: 1px solid #ffeeba;
        }

        #selectionContainer {
            display: none;
            margin-top: 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            background: #f8fafc;
        }
        
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 2px solid #cbd5e1;
        }

        #productList {
            max-height: 250px;
            overflow-y: auto;
            padding-left: 5px;
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5px;
            border-bottom: 1px solid #e2e8f0;
            transition: background 0.2s;
        }

        .product-item label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            width: 100%;
            margin: 0;
            font-weight: normal;
        }

        /* هذا القسم مخفي عن المستخدم وسنستخدمه لتوليد الـ PDF بالخلفية */
        #printArea { 
            position: absolute; 
            left: -9999px; 
            top: 0; 
            background: #fff; 
            direction: rtl;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>مولد ملصقات نجوم ماركت (تصدير PDF المباشر)</h1>
    
    <div class="info-box">
        <strong>وداعاً لمشاكل المقاسات:</strong><br>
        1. الكود الآن يولد لك ملف <strong>PDF</strong> ويحمله مباشرة لجهازك دون المرور بشاشة الطباعة الخاصة بالمتصفح.<br>
        2. عند اختيارك (رول زيبرا 15×6)، سيتم دمج بطاقتين كل واحدة بمقاس (7.5 × 4 سم) وتوسيطهما بداخل الرول تماماً!
    </div>

    <div class="form-group">
        <label for="excelFile">اختر ملف CSV أو Excel:</label>
        <input type="file" id="excelFile" accept=".xlsx, .xls, .csv">
    </div>

    <div class="dimensions-grid" style="grid-template-columns: 1fr; margin-bottom: 15px;">
        <div class="form-group">
            <label>نوع التصدير (PDF):</label>
            <select id="printModeSelect" style="border-color: var(--primary); font-weight: bold; color: var(--primary);">
                <option value="zebra_roll" selected>رول زيبرا المزدوج (15 سم عرض × 6 سم ارتفاع - بطاقتين بجانب بعض)</option>
                <option value="zebra">طابعة زيبرا مفردة (ملصق واحد لكل صفحة)</option>
                <option value="a4">ورق A4 عادي (شبكة ملصقات للقص)</option>
            </select>
        </div>
    </div>

    <div class="dimensions-grid">
        <div class="form-group">
            <label>مقاس البطاقة الواحدة:</label>
            <select id="cardSizeSelect">
                <option value="7.5,4" selected>بطاقة زيبرا (7.5 × 4 سم)</option>
                <option value="7,4.5">الأساسي (7 × 4.5 سم)</option>
                <option value="custom">مقاس مخصص</option>
            </select>
        </div>
        <div class="form-group">
            <label>عرض البطاقة (سم):</label>
            <input type="number" id="widthInput" value="7.5" step="0.1" min="2">
        </div>
        <div class="form-group">
            <label>ارتفاع البطاقة (سم):</label>
            <input type="number" id="heightInput" value="4" step="0.1" min="2">
        </div>
    </div>

    <div id="selectionContainer">
        <div class="list-header">
            <strong>اختر المنتجات للتصدير:</strong>
            <div style="display: flex; gap: 15px; align-items: center;">
                <button type="button" id="selectOffersBtn" class="btn-offer">تحديد العروض فقط</button>
                <label style="display:flex; align-items:center; gap:8px; cursor:pointer; color:var(--primary); font-weight:bold; margin:0;">
                    <input type="checkbox" id="selectAllCheckbox" checked>
                    تحديد الكل
                </label>
            </div>
        </div>
        <div id="productList"></div>
    </div>

    <button class="btn" id="generateBtn" disabled>تحميل ملف الـ PDF 📥</button>
</div>

<!-- حاوية بناء الـ PDF الخفية -->
<div id="printArea"></div>

<script>
    let parsedExcelData = [];

    const cardSizeSelect = document.getElementById('cardSizeSelect');
    const widthInput = document.getElementById('widthInput');
    const heightInput = document.getElementById('heightInput');
    const printModeSelect = document.getElementById('printModeSelect');

    // الضبط التلقائي للمقاسات بناءً على اختيار نوع الطباعة
    printModeSelect.addEventListener('change', (e) => {
        if (e.target.value === 'zebra_roll') {
            cardSizeSelect.value = "7.5,4";
            widthInput.value = 7.5;
            heightInput.value = 4;
        } else {
            cardSizeSelect.value = "7,4.5";
            widthInput.value = 7;
            heightInput.value = 4.5;
        }
    });

    cardSizeSelect.addEventListener('change', (e) => {
        if (e.target.value !== 'custom') {
            const dims = e.target.value.split(',');
            widthInput.value = dims[0];
            heightInput.value = dims[1];
        }
    });

    const excelFileInput = document.getElementById('excelFile');
    const generateBtn = document.getElementById('generateBtn');
    const selectAllCheckbox = document.getElementById('selectAllCheckbox');
    const selectOffersBtn = document.getElementById('selectOffersBtn');
    const selectionContainer = document.getElementById('selectionContainer');
    const productList = document.getElementById('productList');

    excelFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        const isCSV = file.name.toLowerCase().endsWith('.csv');

        reader.onload = function(e) {
            try {
                let workbook;
                if (isCSV) {
                    const text = e.target.result;
                    workbook = XLSX.read(text, { type: 'string' });
                } else {
                    const data = new Uint8Array(e.target.result);
                    workbook = XLSX.read(data, { type: 'array' });
                }
                
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                parsedExcelData = XLSX.utils.sheet_to_json(worksheet, { defval: "", raw: false });
                
                if (parsedExcelData.length === 0) {
                    alert('الملف فارغ أو غير صالح!');
                    selectionContainer.style.display = 'none';
                    generateBtn.disabled = true;
                    return;
                }

                renderProductList(parsedExcelData);

            } catch (err) {
                console.error(err);
                alert('حدث خطأ أثناء قراءة الملف.');
                selectionContainer.style.display = 'none';
                generateBtn.disabled = true;
            }
        };

        if (isCSV) {
            reader.readAsText(file, 'UTF-8');
        } else {
            reader.readAsArrayBuffer(file);
        }
    });

    function renderProductList(data) {
        productList.innerHTML = '';
        selectionContainer.style.display = 'block';
        generateBtn.disabled = false;
        selectAllCheckbox.checked = true;

        data.forEach((row, index) => {
            let name = row['Produkt'] || row['الاسم (عربي)'] || row['الاسم'] || row['name'] || `منتج غير معروف (${index + 1})`;
            let basePrice = row['Preis'] || row['السعر الأساسي'] || row['السعر'] || row['price'] || '';
            let offerPrice = row['سعر العرض'] || row['Offer Price'] || row['Angebotspreis'] || row['offer'] || '';
            
            let hasOffer = offerPrice !== undefined && offerPrice !== null && String(offerPrice).trim() !== "" && String(offerPrice).trim().toLowerCase() !== "nan";
            let displayPrice = hasOffer ? `<span style="text-decoration:line-through; color:#94a3b8; font-size:11px; margin-right:5px;">${basePrice}</span> <span style="color:#d32f2f;">${offerPrice} €</span>` : `<span style="color:#1e293b;">${basePrice} €</span>`;

            const item = document.createElement('div');
            item.className = 'product-item';
            item.innerHTML = `
                <label>
                    <input type="checkbox" class="product-cb" value="${index}" checked>
                    <span style="flex: 1; font-weight: bold; color: #1e293b;">${name}</span>
                    <span style="font-weight: bold;" dir="ltr">${displayPrice}</span>
                </label>
            `;
            productList.appendChild(item);
        });

        const checkboxes = document.querySelectorAll('.product-cb');
        checkboxes.forEach(cb => {
            cb.addEventListener('change', () => {
                const allChecked = document.querySelectorAll('.product-cb:checked').length === checkboxes.length;
                selectAllCheckbox.checked = allChecked;
            });
        });
    }

    selectAllCheckbox.addEventListener('change', (e) => {
        const checkboxes = document.querySelectorAll('.product-cb');
        checkboxes.forEach(cb => cb.checked = e.target.checked);
    });

    selectOffersBtn.addEventListener('click', () => {
        const checkboxes = document.querySelectorAll('.product-cb');
        let offerCount = 0;
        checkboxes.forEach(cb => {
            const index = cb.value;
            const row = parsedExcelData[index];
            let offerPriceRaw = row['سعر العرض'] || row['Offer Price'] || row['Angebotspreis'] || row['offer'] || '';
            const hasOffer = offerPriceRaw !== undefined && offerPriceRaw !== null && String(offerPriceRaw).trim() !== "" && String(offerPriceRaw).trim().toLowerCase() !== "nan";
            cb.checked = hasOffer;
            if (hasOffer) offerCount++;
        });
        selectAllCheckbox.checked = false;
        if (offerCount === 0) alert("لا يوجد أي منتجات عليها عروض في هذا الملف!");
    });

    function formatWeight(w) {
        if (!w) return '';
        let western = String(w).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
        let numMatch = western.match(/[\d.,]+/);
        if (!numMatch) return western; 
        let num = numMatch[0];
        let lower = western.toLowerCase();
        
        let isStuck = ['ظرف', 'قطعه', 'قطعة', 'حبه', 'حبة', 'حبات', 'قطع', 'كيس', 'اكياس'].some(k => western.includes(k));
        if (isStuck) return `${num} Stk`;
        
        if (lower.includes('ml') || lower.includes('مل')) return `${num} ml`;
        if (lower.includes('l') || lower.includes('لتر') || lower.includes('ل')) return `${num} L`;
        if (lower.includes('kg') || lower.includes('كيلو') || lower.includes('كغ')) return `${num} kg`;
        return `${num} g`;
    }

    function cleanPriceVal(val) {
        if (val === undefined || val === null || val === '') return '';
        let cleaned = String(val).replace(/[^\d.,]/g, '').replace(',', '.');
        let num = parseFloat(cleaned);
        return isNaN(num) ? '' : num.toFixed(2).replace('.', ',');
    }

    function calculateGrundpreis(priceStr, weightStr) {
        if (!priceStr || !weightStr) return '';
        let cleanPrice = parseFloat(String(priceStr).replace(/[^\d.,]/g, '').replace(',', '.'));
        if (isNaN(cleanPrice) || cleanPrice === 0) return '';
        
        let wLower = String(weightStr).toLowerCase().trim();
        if (wLower.includes('stk')) return ''; 
        
        let numMatch = wLower.match(/([\d.,]+)/);
        if (!numMatch) return '';
        let val = parseFloat(numMatch[1].replace(',', '.'));
        if (isNaN(val) || val === 0) return '';
        
        let unit = '';
        if (wLower.includes('kg') || wLower.includes('كيلو')) unit = 'kg';
        else if (wLower.includes('g') || wLower.includes('gr') || wLower.includes('غ')) unit = 'g';
        else if (wLower.includes('ml') || wLower.includes('مل')) unit = 'ml';
        else if (wLower.includes('l') || wLower.includes('لتر')) unit = 'l';
        else return '';

        let totalKgOrL = 0;
        let targetUnit = 'Kg';
        
        if (unit === 'g') { totalKgOrL = val / 1000; targetUnit = 'Kg'; }
        else if (unit === 'kg') { totalKgOrL = val; targetUnit = 'Kg'; }
        else if (unit === 'ml') { totalKgOrL = val / 1000; targetUnit = 'L'; }
        else if (unit === 'l') { totalKgOrL = val; targetUnit = 'L'; }
        
        if (totalKgOrL > 0) {
            let grundPrice = (cleanPrice / totalKgOrL).toFixed(2);
            return `${grundPrice.replace('.', ',')} €/${targetUnit}`;
        }
        return '';
    }

    // توليد PDF المباشر عند النقر
    generateBtn.addEventListener('click', () => {
        const checkedBoxes = document.querySelectorAll('.product-cb:checked');
        const selectedData = Array.from(checkedBoxes).map(cb => parsedExcelData[cb.value]);

        if (selectedData.length === 0) {
            alert('الرجاء تحديد منتج واحد على الأقل!');
            return;
        }

        // تغيير شكل الزر لإعلام المستخدم ببدء المعالجة
        generateBtn.innerText = '⏳ جاري المعالجة وتجهيز الـ PDF...';
        generateBtn.disabled = true;

        const printMode = printModeSelect.value;
        const tw_cm = parseFloat(widthInput.value) || 7;
        const th_cm = parseFloat(heightInput.value) || 4.5;
        const tw = tw_cm * 10; // العرض بالمليمتر
        const th = th_cm * 10; // الارتفاع بالمليمتر
        
        const fontScale = Math.min(tw_cm / 7, th_cm / 4.5);
        const printArea = document.getElementById('printArea');
        printArea.innerHTML = '';

        let pdfFormat, pdfOrientation;
        let ticketsPerPage;

        if (printMode === 'a4') {
            pdfFormat = 'a4';
            pdfOrientation = 'portrait';
            const cols = Math.floor(200 / tw) || 1;
            const rows = Math.floor(287 / th) || 1;
            ticketsPerPage = cols * rows;

            selectedData.forEach((row, index) => {
                let pageDiv;
                if (index % ticketsPerPage === 0) {
                    pageDiv = document.createElement('div');
                    pageDiv.className = 'print-page';
                    // إعدادات الـ A4
                    pageDiv.style.width = '210mm';
                    pageDiv.style.height = '297mm';
                    pageDiv.style.padding = '5mm';
                    pageDiv.style.boxSizing = 'border-box';
                    pageDiv.style.display = 'grid';
                    pageDiv.style.gridTemplateColumns = `repeat(${cols}, ${tw}mm)`;
                    pageDiv.style.gridTemplateRows = `repeat(${rows}, ${th}mm)`;
                    pageDiv.style.alignContent = 'start';
                    printArea.appendChild(pageDiv);
                } else {
                    pageDiv = printArea.lastChild;
                }
                pageDiv.appendChild(createTicketHTML(row, tw, th, fontScale, index, 'border: 1px solid #000;'));
            });

        } else if (printMode === 'zebra_roll') {
            // رول زيبرا 15 × 6 سم
            pdfFormat = [150, 60]; 
            pdfOrientation = 'landscape';
            ticketsPerPage = 2; // بطاقتين بالعرض

            selectedData.forEach((row, index) => {
                let pageDiv;
                if (index % ticketsPerPage === 0) {
                    pageDiv = document.createElement('div');
                    pageDiv.className = 'print-page';
                    // الحاوية الكلية للصفحة 150 عرض و 60 طول
                    pageDiv.style.width = '150mm';
                    pageDiv.style.height = '60mm';
                    pageDiv.style.display = 'flex';
                    pageDiv.style.flexDirection = 'row';
                    // توسيط البطاقات عمودياً داخل الـ 60 ملم (بما أن البطاقة ارتفاعها 40 ملم فقط)
                    pageDiv.style.alignItems = 'center'; 
                    pageDiv.style.justifyContent = 'flex-start';
                    pageDiv.style.boxSizing = 'border-box';
                    printArea.appendChild(pageDiv);
                } else {
                    pageDiv = printArea.lastChild;
                }
                
                // إضافة خط وهمي في المنتصف للبطاقة الثانية فقط
                let borderStyle = (index % 2 === 1) ? 'border-right: 1px dashed #999;' : '';
                pageDiv.appendChild(createTicketHTML(row, tw, th, fontScale, index, borderStyle));
            });

        } else {
            // زيبرا مفرد
            pdfFormat = [tw, th];
            pdfOrientation = tw > th ? 'landscape' : 'portrait';
            ticketsPerPage = 1;

            selectedData.forEach((row, index) => {
                let pageDiv = document.createElement('div');
                pageDiv.className = 'print-page';
                pageDiv.style.width = `${tw}mm`;
                pageDiv.style.height = `${th}mm`;
                pageDiv.style.display = 'flex';
                pageDiv.style.boxSizing = 'border-box';
                printArea.appendChild(pageDiv);
                
                pageDiv.appendChild(createTicketHTML(row, tw, th, fontScale, index, ''));
            });
        }

        // رسم الباركودات باستخدام مكتبة Canvas لضمان الجودة في الـ PDF
        setTimeout(() => {
            selectedData.forEach((row, index) => {
                let barcode = row['Barcode'] || row['الباركود'] || row['barcode'] || '';
                if (barcode) {
                    try {
                        JsBarcode(`#barcode-${index}`, String(barcode), {
                            format: "CODE128",
                            displayValue: true,
                            fontSize: 10 * fontScale,
                            height: 20 * fontScale,
                            margin: 0
                        });
                    } catch (e) {}
                }
            });

            // إعدادات مكتبة html2pdf لتوليد الملف
            const opt = {
                margin:       0,
                filename:     `Nogoom_Labels_${new Date().getTime()}.pdf`,
                image:        { type: 'jpeg', quality: 1 },
                // scale 4 يضمن جودة عالية جداً وخالية من البكسلة للطباعة
                html2canvas:  { scale: 4, useCORS: true, logging: false },
                jsPDF:        { unit: 'mm', format: pdfFormat, orientation: pdfOrientation }
            };

            // توليد وحفظ الـ PDF
            html2pdf().set(opt).from(printArea).save().then(() => {
                generateBtn.innerText = 'تحميل ملف الـ PDF 📥';
                generateBtn.disabled = false;
                printArea.innerHTML = ''; // تنظيف الحاوية
            });

        }, 500); // مهلة صغيرة للتأكد من رسم الباركود والخطوط
    });

    // دالة مساعدة لإنشاء HTML البطاقة بشكل مستقل
    function createTicketHTML(row, tw, th, fontScale, index, borderStyle) {
        let arabicName = row['Produkt'] || row['الاسم (عربي)'] || row['الاسم'] || row['name'] || '';
        let latinName = row['DE Name'] || row['de name'] || row['الاسم (ألماني/لاتيني)'] || row['Translated'] || '';
        let weightRaw = row['Beschreibung'] || row['الوزن'] || row['Unnamed: 4'] || '';
        let basePriceRaw = row['Preis'] || row['السعر الأساسي'] || row['السعر'] || row['price'] || '';
        let offerPriceRaw = row['سعر العرض'] || row['Offer Price'] || row['Angebotspreis'] || row['offer'] || '';

        const weight = formatWeight(weightRaw);
        const hasOffer = offerPriceRaw !== undefined && offerPriceRaw !== null && String(offerPriceRaw).trim() !== "" && String(offerPriceRaw).trim().toLowerCase() !== "nan";
        const boxBgColor = hasOffer ? '#7f1d1d' : '#1e293b'; 
        
        const mainPriceNum = hasOffer ? cleanPriceVal(offerPriceRaw) : cleanPriceVal(basePriceRaw);
        const oldPriceNum = hasOffer ? cleanPriceVal(basePriceRaw) : '';
        const grundpreisText = calculateGrundpreis(mainPriceNum, weight);

        const ticketDiv = document.createElement('div');
        // التحكم الصارم بأبعاد البطاقة بالمليمتر
        ticketDiv.style.width = `${tw}mm`;
        ticketDiv.style.height = `${th}mm`;
        ticketDiv.style.minWidth = `${tw}mm`;
        ticketDiv.style.minHeight = `${th}mm`;
        ticketDiv.style.boxSizing = 'border-box';
        ticketDiv.style.overflow = 'hidden';
        ticketDiv.style.display = 'flex';
        ticketDiv.style.flexDirection = 'column';
        ticketDiv.style.justifyContent = 'space-between';
        ticketDiv.style.padding = `${3 * fontScale}mm ${4 * fontScale}mm`;
        ticketDiv.style.background = '#ffffff';
        if(borderStyle) ticketDiv.style.cssText += borderStyle;

        ticketDiv.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: flex-start; flex: 1; overflow: hidden; margin-bottom: ${3 * fontScale}px;">
                <div style="font-weight: bold; color: #111; text-align: left; max-width: 65%;">
                    <div style="color: #111; direction: rtl; text-align: right; font-weight: bold; font-size: ${13 * fontScale}px; line-height: 1.1;">${arabicName}</div>
                    <div style="font-weight: bold; font-size: ${12 * fontScale}px; direction: ltr; text-align: left; line-height: 1.1; margin-top: 2px;">${latinName}</div>
                    <div style="font-size: ${11 * fontScale}px; color: #333; font-weight: bold; direction: ltr; text-align: left; margin-top: 2px;">${weight}</div>
                </div>
                <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">
                    <div style="background-color: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 3px; padding: ${2 * fontScale}px ${4 * fontScale}px; font-size: ${8 * fontScale}px; font-weight: bold; color: #334155; white-space: nowrap;">
                        Nogoom Markt
                    </div>
                    ${grundpreisText ? `<div style="font-size: ${9 * fontScale}px; color: #475569; font-weight: bold; direction: ltr; white-space: nowrap;">${grundpreisText}</div>` : ''}
                </div>
            </div>

            <div style="position: relative; background-color: ${boxBgColor}; color: #ffffff; padding: 0; display: flex; justify-content: center; align-items: center; border-radius: 4px; flex: 0 0 calc(48px * ${fontScale}); height: calc(48px * ${fontScale}); overflow: hidden;">
                ${oldPriceNum ? `<div style="position: absolute; left: ${8 * fontScale}px; font-size: ${16 * fontScale}px; text-decoration: line-through; color: #fca5a5; font-weight: bold;" dir="ltr">${oldPriceNum} €</div>` : ''}
                <div style="font-size: ${48 * fontScale}px; font-weight: bold; letter-spacing: -1px; line-height: 1; color: #ffffff;" dir="ltr">
                    ${mainPriceNum ? `${mainPriceNum} <span style="font-size:${28 * fontScale}px; color: #ffffff;">€</span>` : ''}
                </div>
            </div>

            <div style="display: flex; justify-content: center; align-items: center; flex: 0 0 auto; margin-top: ${3 * fontScale}px; height: ${24 * fontScale}px; overflow: hidden;">
                <div style="width: 100%; display: flex; justify-content: center; align-items: center; height: 100%;">
                    <!-- استخدام عنصر canvas لضمان طباعته بوضوح في الـ PDF -->
                    <canvas id="barcode-${index}" style="max-height: 100%; max-width: 100%; object-fit: contain;"></canvas>
                </div>
            </div>
        `;
        return ticketDiv;
    }
</script>

</body>
</html>
