<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مولد ملصقات نجوم ماركت - PDF المباشر الآمن</title>
    <!-- مكتبة قراءة الإكسل و CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- مكتبة توليد الباركود -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
    <!-- مكتبات توليد الـ PDF الاحترافية (تمنع انهيار الآيفون) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: var(--primary);
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="file"], input[type="number"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: #fff;
        }

        .dimensions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .btn-offer {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-offer:hover {
            background-color: #dc2626;
        }

        .info-box {
            background: #e0f2fe;
            color: #0369a1;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        #selectionContainer {
            display: none;
            margin-top: 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            background: #f8fafc;
        }
        
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 2px solid #cbd5e1;
        }

        #productList {
            max-height: 250px;
            overflow-y: auto;
            padding-left: 5px;
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5px;
            border-bottom: 1px solid #e2e8f0;
            transition: background 0.2s;
        }

        .product-item label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            width: 100%;
            margin: 0;
            font-weight: normal;
        }

        /* هذا القسم مخفي ويُستخدم لرسم البطاقات وتحويلها إلى PDF دون أن تظهر للمستخدم */
        #printArea { 
            position: absolute; 
            left: -9999px; 
            top: 0; 
            direction: ltr; /* LTR ضروري جداً لمنع انقلاب الإحداثيات عند دوران البطاقة */
        }
    </style>
</head>
<body>

<div class="container">
    <h1>مولد ملصقات نجوم ماركت (تصدير PDF المستقر)</h1>
    
    <div class="info-box">
        <strong>وداعاً لمشاكل طباعة الآيفون:</strong><br>
        تم إلغاء فتح شاشة الطباعة من المتصفح. البرنامج الآن يولد ملف <strong>PDF</strong> حقيقي وداخلي ويقوم بتنزيله لجهازك بمقاسات محكمة لا يمكن للجوال تغييرها.
    </div>

    <div class="form-group">
        <label for="excelFile">اختر ملف CSV أو Excel:</label>
        <input type="file" id="excelFile" accept=".xlsx, .xls, .csv">
    </div>

    <div class="dimensions-grid" style="grid-template-columns: 1fr; margin-bottom: 15px;">
        <div class="form-group">
            <label>نوع التصدير (PDF):</label>
            <select id="printModeSelect" style="border-color: var(--primary); font-weight: bold; color: var(--primary);">
                <option value="zebra_roll" selected>رول زيبرا المزدوج (ملف مقاسه 6 سم عرض × 15 سم طول)</option>
                <option value="zebra">طابعة زيبرا مفردة (ملصق واحد لكل صفحة)</option>
                <option value="a4">ورق A4 عادي (شبكة ملصقات للقص)</option>
            </select>
        </div>
    </div>

    <div class="dimensions-grid">
        <div class="form-group">
            <label>مقاس البطاقة الواحدة:</label>
            <select id="cardSizeSelect">
                <option value="7.5,4" selected>بطاقة زيبرا (7.5 × 4 سم)</option>
                <option value="7,4.5">الأساسي (7 × 4.5 سم)</option>
                <option value="custom">مقاس مخصص</option>
            </select>
        </div>
        <div class="form-group">
            <label>عرض البطاقة (سم):</label>
            <input type="number" id="widthInput" value="7.5" step="0.1" min="2">
        </div>
        <div class="form-group">
            <label>ارتفاع البطاقة (سم):</label>
            <input type="number" id="heightInput" value="4" step="0.1" min="2">
        </div>
    </div>

    <div id="selectionContainer">
        <div class="list-header">
            <strong>اختر المنتجات للتصدير:</strong>
            <div style="display: flex; gap: 15px; align-items: center;">
                <button type="button" id="selectOffersBtn" class="btn-offer">تحديد العروض فقط</button>
                <label style="display:flex; align-items:center; gap:8px; cursor:pointer; color:var(--primary); font-weight:bold; margin:0;">
                    <input type="checkbox" id="selectAllCheckbox" checked>
                    تحديد الكل
                </label>
            </div>
        </div>
        <div id="productList"></div>
    </div>

    <button class="btn" id="generateBtn" disabled>إنشاء وتنزيل ملف PDF 📥</button>
</div>

<div id="printArea"></div>

<script>
    let parsedExcelData = [];

    const cardSizeSelect = document.getElementById('cardSizeSelect');
    const widthInput = document.getElementById('widthInput');
    const heightInput = document.getElementById('heightInput');
    const printModeSelect = document.getElementById('printModeSelect');

    printModeSelect.addEventListener('change', (e) => {
        if (e.target.value === 'zebra_roll') {
            cardSizeSelect.value = "7.5,4";
            widthInput.value = 7.5;
            heightInput.value = 4;
        } else {
            cardSizeSelect.value = "7,4.5";
            widthInput.value = 7;
            heightInput.value = 4.5;
        }
    });

    cardSizeSelect.addEventListener('change', (e) => {
        if (e.target.value !== 'custom') {
            const dims = e.target.value.split(',');
            widthInput.value = dims[0];
            heightInput.value = dims[1];
        }
    });

    const excelFileInput = document.getElementById('excelFile');
    const generateBtn = document.getElementById('generateBtn');
    const selectAllCheckbox = document.getElementById('selectAllCheckbox');
    const selectOffersBtn = document.getElementById('selectOffersBtn');
    const selectionContainer = document.getElementById('selectionContainer');
    const productList = document.getElementById('productList');

    excelFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        const isCSV = file.name.toLowerCase().endsWith('.csv');

        reader.onload = function(e) {
            try {
                let workbook;
                if (isCSV) {
                    const text = e.target.result;
                    workbook = XLSX.read(text, { type: 'string' });
                } else {
                    const data = new Uint8Array(e.target.result);
                    workbook = XLSX.read(data, { type: 'array' });
                }
                
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                parsedExcelData = XLSX.utils.sheet_to_json(worksheet, { defval: "", raw: false });
                
                if (parsedExcelData.length === 0) {
                    alert('الملف فارغ أو غير صالح!');
                    selectionContainer.style.display = 'none';
                    generateBtn.disabled = true;
                    return;
                }

                renderProductList(parsedExcelData);

            } catch (err) {
                console.error(err);
                alert('حدث خطأ أثناء قراءة الملف.');
                selectionContainer.style.display = 'none';
                generateBtn.disabled = true;
            }
        };

        if (isCSV) {
            reader.readAsText(file, 'UTF-8');
        } else {
            reader.readAsArrayBuffer(file);
        }
    });

    function renderProductList(data) {
        productList.innerHTML = '';
        selectionContainer.style.display = 'block';
        generateBtn.disabled = false;
        selectAllCheckbox.checked = true;

        data.forEach((row, index) => {
            let name = row['Produkt'] || row['الاسم (عربي)'] || row['الاسم'] || row['name'] || `منتج غير معروف (${index + 1})`;
            let basePrice = row['Preis'] || row['السعر الأساسي'] || row['السعر'] || row['price'] || '';
            let offerPrice = row['سعر العرض'] || row['Offer Price'] || row['Angebotspreis'] || row['offer'] || '';
            
            let hasOffer = offerPrice !== undefined && offerPrice !== null && String(offerPrice).trim() !== "" && String(offerPrice).trim().toLowerCase() !== "nan";
            let displayPrice = hasOffer ? `<span style="text-decoration:line-through; color:#94a3b8; font-size:11px; margin-right:5px;">${basePrice}</span> <span style="color:#d32f2f;">${offerPrice} €</span>` : `<span style="color:#1e293b;">${basePrice} €</span>`;

            const item = document.createElement('div');
            item.className = 'product-item';
            item.innerHTML = `
                <label>
                    <input type="checkbox" class="product-cb" value="${index}" checked>
                    <span style="flex: 1; font-weight: bold; color: #1e293b;">${name}</span>
                    <span style="font-weight: bold;" dir="ltr">${displayPrice}</span>
                </label>
            `;
            productList.appendChild(item);
        });

        const checkboxes = document.querySelectorAll('.product-cb');
        checkboxes.forEach(cb => {
            cb.addEventListener('change', () => {
                const allChecked = document.querySelectorAll('.product-cb:checked').length === checkboxes.length;
                selectAllCheckbox.checked = allChecked;
            });
        });
    }

    selectAllCheckbox.addEventListener('change', (e) => {
        const checkboxes = document.querySelectorAll('.product-cb');
        checkboxes.forEach(cb => cb.checked = e.target.checked);
    });

    selectOffersBtn.addEventListener('click', () => {
        const checkboxes = document.querySelectorAll('.product-cb');
        let offerCount = 0;
        checkboxes.forEach(cb => {
            const index = cb.value;
            const row = parsedExcelData[index];
            let offerPriceRaw = row['سعر العرض'] || row['Offer Price'] || row['Angebotspreis'] || row['offer'] || '';
            const hasOffer = offerPriceRaw !== undefined && offerPriceRaw !== null && String(offerPriceRaw).trim() !== "" && String(offerPriceRaw).trim().toLowerCase() !== "nan";
            cb.checked = hasOffer;
            if (hasOffer) offerCount++;
        });
        selectAllCheckbox.checked = false;
        if (offerCount === 0) alert("لا يوجد أي منتجات عليها عروض في هذا الملف!");
    });

    function formatWeight(w) {
        if (!w) return '';
        let western = String(w).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
        let numMatch = western.match(/[\d.,]+/);
        if (!numMatch) return western; 
        let num = numMatch[0];
        let lower = western.toLowerCase();
        
        let isStuck = ['ظرف', 'قطعه', 'قطعة', 'حبه', 'حبة', 'حبات', 'قطع', 'كيس', 'اكياس'].some(k => western.includes(k));
        if (isStuck) return `${num} Stk`;
        
        if (lower.includes('ml') || lower.includes('مل')) return `${num} ml`;
        if (lower.includes('l') || lower.includes('لتر') || lower.includes('ل')) return `${num} L`;
        if (lower.includes('kg') || lower.includes('كيلو') || lower.includes('كغ')) return `${num} kg`;
        return `${num} g`;
    }

    function cleanPriceVal(val) {
        if (val === undefined || val === null || val === '') return '';
        let cleaned = String(val).replace(/[^\d.,]/g, '').replace(',', '.');
        let num = parseFloat(cleaned);
        return isNaN(num) ? '' : num.toFixed(2).replace('.', ',');
    }

    function calculateGrundpreis(priceStr, weightStr) {
        if (!priceStr || !weightStr) return '';
        let cleanPrice = parseFloat(String(priceStr).replace(/[^\d.,]/g, '').replace(',', '.'));
        if (isNaN(cleanPrice) || cleanPrice === 0) return '';
        
        let wLower = String(weightStr).toLowerCase().trim();
        if (wLower.includes('stk')) return ''; 
        
        let numMatch = wLower.match(/([\d.,]+)/);
        if (!numMatch) return '';
        let val = parseFloat(numMatch[1].replace(',', '.'));
        if (isNaN(val) || val === 0) return '';
        
        let unit = '';
        if (wLower.includes('kg') || wLower.includes('كيلو')) unit = 'kg';
        else if (wLower.includes('g') || wLower.includes('gr') || wLower.includes('غ')) unit = 'g';
        else if (wLower.includes('ml') || wLower.includes('مل')) unit = 'ml';
        else if (wLower.includes('l') || wLower.includes('لتر')) unit = 'l';
        else return '';

        let totalKgOrL = 0;
        let targetUnit = 'Kg';
        
        if (unit === 'g') { totalKgOrL = val / 1000; targetUnit = 'Kg'; }
        else if (unit === 'kg') { totalKgOrL = val; targetUnit = 'Kg'; }
        else if (unit === 'ml') { totalKgOrL = val / 1000; targetUnit = 'L'; }
        else if (unit === 'l') { totalKgOrL = val; targetUnit = 'L'; }
        
        if (totalKgOrL > 0) {
            let grundPrice = (cleanPrice / totalKgOrL).toFixed(2);
            return `${grundPrice.replace('.', ',')} €/${targetUnit}`;
        }
        return '';
    }

    // بناء البطاقة
    function createTicketHTML(row, tw, th, fontScale, index, boxBorder) {
        let arabicName = row['Produkt'] || row['الاسم (عربي)'] || row['الاسم'] || row['name'] || '';
        let latinName = row['DE Name'] || row['de name'] || row['الاسم (ألماني/لاتيني)'] || row['Translated'] || '';
        let weightRaw = row['Beschreibung'] || row['الوزن'] || row['Unnamed: 4'] || '';
        let barcode = row['Barcode'] || row['الباركود'] || row['barcode'] || '';
        let basePriceRaw = row['Preis'] || row['السعر الأساسي'] || row['السعر'] || row['price'] || '';
        let offerPriceRaw = row['سعر العرض'] || row['Offer Price'] || row['Angebotspreis'] || row['offer'] || '';

        const weight = formatWeight(weightRaw);
        const hasOffer = offerPriceRaw !== undefined && offerPriceRaw !== null && String(offerPriceRaw).trim() !== "" && String(offerPriceRaw).trim().toLowerCase() !== "nan";
        const boxBgColor = hasOffer ? '#7f1d1d' : '#1e293b'; 
        
        const mainPriceNum = hasOffer ? cleanPriceVal(offerPriceRaw) : cleanPriceVal(basePriceRaw);
        const oldPriceNum = hasOffer ? cleanPriceVal(basePriceRaw) : '';
        const grundpreisText = calculateGrundpreis(mainPriceNum, weight);

        const ticketDiv = document.createElement('div');
        // نضع اتجاه الـ LTR داخل البطاقة للحفاظ على الأرقام، مع توجيه النصوص العربية لليمين
        ticketDiv.style.cssText = `
            width: ${tw}mm; height: ${th}mm;
            box-sizing: border-box; overflow: hidden; background: #fff;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: ${3 * fontScale}mm ${4 * fontScale}mm;
            ${boxBorder}
        `;

        ticketDiv.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: flex-start; flex: 1; overflow: hidden; margin-bottom: ${3 * fontScale}px; flex-direction: row-reverse;">
                
                <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px;">
                    <div style="background-color: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 3px; padding: ${2 * fontScale}px ${4 * fontScale}px; font-size: ${8 * fontScale}px; font-weight: bold; color: #334155; white-space: nowrap;">
                        Nogoom Markt
                    </div>
                    ${grundpreisText ? `<div style="font-size: ${9 * fontScale}px; color: #475569; font-weight: bold; direction: ltr; white-space: nowrap;">${grundpreisText}</div>` : ''}
                </div>

                <div style="font-weight: bold; color: #111; text-align: right; max-width: 65%;">
                    <div style="color: #111; direction: rtl; font-weight: bold; font-size: ${13 * fontScale}px; line-height: 1.1;">${arabicName}</div>
                    <div style="font-weight: bold; font-size: ${12 * fontScale}px; direction: ltr; text-align: right; line-height: 1.1; margin-top: 2px;">${latinName}</div>
                    <div style="font-size: ${11 * fontScale}px; color: #333; font-weight: bold; direction: ltr; text-align: right; margin-top: 2px;">${weight}</div>
                </div>

            </div>

            <div style="position: relative; background-color: ${boxBgColor}; padding: 0; display: flex; justify-content: center; align-items: center; border-radius: 4px; flex: 0 0 calc(48px * ${fontScale}); height: calc(48px * ${fontScale}); overflow: hidden;">
                ${oldPriceNum ? `<div style="position: absolute; right: ${8 * fontScale}px; font-size: ${16 * fontScale}px; text-decoration: line-through; color: #fca5a5; font-weight: bold;" dir="ltr">${oldPriceNum} €</div>` : ''}
                <div style="font-size: ${48 * fontScale}px; font-weight: bold; letter-spacing: -1px; line-height: 1; color: #ffffff;" dir="ltr">
                    ${mainPriceNum ? `${mainPriceNum} <span style="font-size:${28 * fontScale}px; color: #ffffff;">€</span>` : ''}
                </div>
            </div>

            <div style="display: flex; justify-content: center; align-items: center; flex: 0 0 auto; margin-top: ${3 * fontScale}px; height: ${24 * fontScale}px; overflow: hidden;">
                <canvas id="barcode-${index}" style="max-height: 100%; max-width: 100%;"></canvas>
            </div>
        `;

        // إرجاع العنصر والرقم لنولد الباركود لاحقاً
        return { element: ticketDiv, barcode: String(barcode), index: index, scale: fontScale };
    }

    // دالة المعالجة وتصدير الـ PDF باستخدام jsPDF بشكل آمن
    generateBtn.addEventListener('click', async () => {
        const checkedBoxes = document.querySelectorAll('.product-cb:checked');
        const selectedData = Array.from(checkedBoxes).map(cb => parsedExcelData[cb.value]);

        if (selectedData.length === 0) {
            alert('الرجاء تحديد منتج واحد على الأقل!');
            return;
        }

        generateBtn.innerText = '⏳ جاري المعالجة وتجهيز ملف PDF...';
        generateBtn.disabled = true;

        const printMode = printModeSelect.value;
        const tw_cm = parseFloat(widthInput.value) || 7.5;
        const th_cm = parseFloat(heightInput.value) || 4;
        const tw = tw_cm * 10; 
        const th = th_cm * 10; 
        const fontScale = Math.min(tw_cm / 7, th_cm / 4.5);
        
        const printArea = document.getElementById('printArea');
        printArea.innerHTML = '';

        const { jsPDF } = window.jspdf;
        let pdfFormat, pdfOrientation, ticketsPerPage;
        let doc;

        if (printMode === 'a4') {
            pdfFormat = 'a4';
            pdfOrientation = 'portrait';
            const cols = Math.floor(200 / tw) || 1;
            const rows = Math.floor(287 / th) || 1;
            ticketsPerPage = cols * rows;
            doc = new jsPDF({ orientation: pdfOrientation, unit: 'mm', format: pdfFormat });
        } else if (printMode === 'zebra_roll') {
            // رول زيبرا: 6 سم عرض، 15 سم طول
            pdfFormat = [60, 150]; 
            pdfOrientation = 'portrait';
            ticketsPerPage = 2;
            doc = new jsPDF({ orientation: pdfOrientation, unit: 'mm', format: pdfFormat });
        } else {
            pdfFormat = [tw, th];
            pdfOrientation = tw > th ? 'landscape' : 'portrait';
            ticketsPerPage = 1;
            doc = new jsPDF({ orientation: pdfOrientation, unit: 'mm', format: pdfFormat });
        }

        let barcodeTasks = [];
        let pages = [];
        let currentPageDiv;

        // تجهيز الـ HTML المخفي لكل الصفحات
        selectedData.forEach((row, index) => {
            if (index % ticketsPerPage === 0) {
                currentPageDiv = document.createElement('div');
                currentPageDiv.className = 'render-page';
                currentPageDiv.style.background = '#fff';
                currentPageDiv.style.position = 'relative';
                
                if (printMode === 'a4') {
                    const cols = Math.floor(200 / tw) || 1;
                    currentPageDiv.style.width = '210mm';
                    currentPageDiv.style.height = '297mm';
                    currentPageDiv.style.padding = '5mm';
                    currentPageDiv.style.display = 'flex';
                    currentPageDiv.style.flexWrap = 'wrap';
                    currentPageDiv.style.alignContent = 'flex-start';
                } else if (printMode === 'zebra_roll') {
                    currentPageDiv.style.width = '60mm';
                    currentPageDiv.style.height = '150mm';
                    
                    // خط وهمي للقص في المنتصف
                    let cutLine = document.createElement('div');
                    cutLine.style.position = 'absolute';
                    cutLine.style.top = '75mm';
                    cutLine.style.left = '0';
                    cutLine.style.width = '60mm';
                    cutLine.style.height = '1px';
                    cutLine.style.borderTop = '1px dashed #000';
                    currentPageDiv.appendChild(cutLine);

                } else {
                    currentPageDiv.style.width = `${tw}mm`;
                    currentPageDiv.style.height = `${th}mm`;
                    currentPageDiv.style.display = 'flex';
                }
                
                printArea.appendChild(currentPageDiv);
                pages.push(currentPageDiv);
            }

            let ticketData;
            if (printMode === 'a4') {
                ticketData = createTicketHTML(row, tw, th, fontScale, index, 'border: 1px solid #ccc;');
                currentPageDiv.appendChild(ticketData.element);
            } else if (printMode === 'zebra_roll') {
                ticketData = createTicketHTML(row, tw, th, fontScale, index, '');
                
                // حاوية لتدوير البطاقة ووضعها داخل الـ 6×15
                let wrapper = document.createElement('div');
                wrapper.style.position = 'absolute';
                wrapper.style.width = `${tw}mm`;
                wrapper.style.height = `${th}mm`;
                wrapper.style.left = '-7.5mm'; // المركز 30 - النصف 37.5 = -7.5
                wrapper.style.transform = 'rotate(90deg)';
                wrapper.style.transformOrigin = 'center';
                
                if (index % 2 === 0) {
                    wrapper.style.top = '17.5mm'; // القسم العلوي
                } else {
                    wrapper.style.top = '92.5mm'; // القسم السفلي
                }
                
                wrapper.appendChild(ticketData.element);
                currentPageDiv.appendChild(wrapper);
            } else {
                ticketData = createTicketHTML(row, tw, th, fontScale, index, '');
                currentPageDiv.appendChild(ticketData.element);
            }

            barcodeTasks.push(ticketData);
        });

        // رسم الباركودات
        barcodeTasks.forEach(task => {
            if (task.barcode) {
                try {
                    JsBarcode(task.element.querySelector(`#barcode-${task.index}`), task.barcode, {
                        format: "CODE128",
                        displayValue: true,
                        fontSize: 10 * task.scale,
                        height: 20 * task.scale,
                        margin: 0
                    });
                } catch (err) {}
            }
        });

        // تحويل كل صفحة إلى صورة ووضعها في الـ PDF (يمنع انهيار الجوال)
        setTimeout(async () => {
            for (let i = 0; i < pages.length; i++) {
                if (i > 0) doc.addPage();
                
                // استخدام html2canvas بدقة 3 (دقة ممتازة للطباعة وخفيفة على الذاكرة)
                const canvas = await html2canvas(pages[i], { scale: 3, useCORS: true, logging: false });
                const imgData = canvas.toDataURL('image/jpeg', 0.98);
                
                if (printMode === 'a4') {
                    doc.addImage(imgData, 'JPEG', 0, 0, 210, 297);
                } else if (printMode === 'zebra_roll') {
                    doc.addImage(imgData, 'JPEG', 0, 0, 60, 150);
                } else {
                    doc.addImage(imgData, 'JPEG', 0, 0, tw, th);
                }
            }

            doc.save(`Nogoom_Labels_${new Date().getTime()}.pdf`);
            
            generateBtn.innerText = 'إنشاء وتنزيل ملف PDF 📥';
            generateBtn.disabled = false;
            printArea.innerHTML = ''; 
        }, 500);
    });
</script>
