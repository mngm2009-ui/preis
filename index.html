<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد ملصقات نجوم ماركت - الاحترافي</title>
    <!-- مكتبة قراءة الإكسل و CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- مكتبة توليد الباركود JsBarcode -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-print-color-adjust: exact !important; 
            print-color-adjust: exact !important;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: var(--primary);
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="file"], input[type="number"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: #fff;
        }

        .dimensions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .info-box {
            background: #e0f2fe;
            color: #0369a1;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        #selectionContainer {
            display: none;
            margin-top: 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            background: #f8fafc;
        }
        
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 2px solid #cbd5e1;
        }

        #productList {
            max-height: 250px;
            overflow-y: auto;
            padding-left: 5px;
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5px;
            border-bottom: 1px solid #e2e8f0;
            transition: background 0.2s;
        }
        
        .product-item:hover {
            background: #e0e7ff;
        }

        .product-item label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            width: 100%;
            margin: 0;
            font-weight: normal;
        }

        .product-item input[type="checkbox"], #selectAllCheckbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        #printArea { display: none; }

        @media print {
            body { background-color: #ffffff; padding: 0; margin: 0; }
            .no-print { display: none !important; }
            #printArea { display: block !important; }
        }
    </style>
</head>
<body>

<div class="container no-print">
    <h1>مولد ملصقات نجوم ماركت (الترجمة الصارمة للمواد)</h1>
    
    <div class="info-box">
        <strong>القاعدة الذكية:</strong>
        <ol style="margin-right: 20px; margin-top: 5px;">
            <li>تمت تهيئة الكود ليقرأ ملفك الحالي بشكل مباشر (الأعمدة المخفية للوزن وعمود name/price).</li>
            <li>تحويل الحروف يتم فقط لما هو مكتوب داخل <strong>( الأقواس )</strong> كعلامة تجارية.</li>
        </ol>
    </div>

    <div class="form-group">
        <label for="excelFile">اختر ملف CSV أو Excel:</label>
        <input type="file" id="excelFile" accept=".xlsx, .xls, .csv">
    </div>

    <div class="dimensions-grid">
        <div class="form-group">
            <label>مقاس البطاقة:</label>
            <select id="cardSizeSelect">
                <option value="7,4.5" selected>الأساسي (7 × 4.5 سم)</option>
                <option value="19,13.5">مقاس A5</option>
                <option value="9.5,13.5">مقاس A6</option>
                <option value="9.5,6.5">مقاس A7</option>
                <option value="custom">مقاس مخصص</option>
            </select>
        </div>
        <div class="form-group">
            <label>عرض البطاقة (سم):</label>
            <input type="number" id="widthInput" value="7" step="0.1" min="2">
        </div>
        <div class="form-group">
            <label>ارتفاع البطاقة (سم):</label>
            <input type="number" id="heightInput" value="4.5" step="0.1" min="2">
        </div>
    </div>

    <div id="selectionContainer">
        <div class="list-header">
            <strong>اختر المنتجات للطباعة:</strong>
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer; color:var(--primary); font-weight:bold; margin:0;">
                <input type="checkbox" id="selectAllCheckbox" checked>
                تحديد الكل
            </label>
        </div>
        <div id="productList"></div>
    </div>

    <button class="btn" id="generateBtn" disabled>توليد الملصقات للطباعة / حفظ PDF</button>
</div>

<div id="printArea"></div>

<script>
    let parsedExcelData = [];
    
    // القاموس الألماني الشامل للترجمة الحرفية
    const exactTranslations = {
        'مربى الفراوله': 'Erdbeermarmelade', 'مربى الفراولة': 'Erdbeermarmelade', 'مربى المشمش': 'Aprikosenmarmelade',
        'مربى التين': 'Feigenmarmelade', 'مربى الكرز': 'Kirschmarmelade', 'مربى التوت': 'Beerenmarmelade',
        'مربى': 'Marmelade', 'فراوله': 'Erdbeere', 'فراولة': 'Erdbeere', 'مشمش': 'Aprikose', 'تين': 'Feige', 
        'كرز': 'Kirsche', 'عسل': 'Honig', 'شوكولاته': 'Schokolade', 'شوكولا': 'Schokolade',
        'حلاوه': 'Halawa', 'حلاوة': 'Halawa', 'طحينيه': 'Tahini', 'طحينية': 'Tahini',
        'عنب': 'Trauben', 'تمر': 'Datteln', 'دبس تمر': 'Dattelsirup', 'دبس عنب': 'Traubensirup',
        
        'سبع بهارات مشكله': 'Sieben Gewürze (Baharat)', 'بهارات الدجاج': 'Hähnchengewürz',
        'بهارات الشاورما': 'Shawarma Gewürz', 'شاورما دجاج': 'Hähnchen-Shawarma',
        'شاورما اللحم': 'Fleisch-Shawarma', 'اللحم المشوي': 'Grillfleisch',
        'شيش طاووق': 'Shish Taouk', 'برغر': 'Burger', 'سمك': 'Fisch',
        'كاري حار': 'Scharfes Curry', 'كاري': 'Curry', 'بابريكا': 'Paprika',
        'فلفل ابيض': 'Weißer Pfeffer', 'فلفل اسود': 'Schwarzer Pfeffer', 'فلفل احمر': 'Roter Pfeffer',
        'شطه حاره': 'Scharfes Chili', 'شطه': 'Chili', 'ورق الغار': 'Lorbeerblätter',
        'الرند': 'Lorbeerblätter', 'خميره فوريه': 'Trockenhefe', 'خميره': 'Hefe',
        'اكليل الجبل': 'Rosmarin', 'اوريغانو': 'Oregano', 'زعتر بري': 'Wilder Thymian',
        'زعتر': 'Zaatar', 'كربونات الصوديوم': 'Natron', 'لومي': 'Loomi (Limette)',
        'ليمون': 'Zitrone', 'يانسون': 'Anis', 'بصل': 'Zwiebel', 'ثوم': 'Knoblauch',
        'كزبره': 'Koriander', 'كمون': 'Kreuzkümmel', 'كركم': 'Kurkuma', 'هيل': 'Kardamom',
        'قرنفل': 'Nelken', 'زنجبيل': 'Ingwer', 'سماق': 'Sumach', 'جوزه الطيب': 'Muskatnuss',
        'بهارات': 'Gewürze', 'دبس رمان': 'Granatapfelsirup', 'معجون طماطم': 'Tomatenmark',
        'زيت زيتون': 'Olivenöl', 'قهوه': 'Kaffee', 'بن': 'Kaffee', 'شاي': 'Tee',
        'زيت': 'Öl', 'زيتون': 'Oliven', 'جبنه': 'Käse', 'جبن': 'Käse', 'حلوم': 'Halloumi',
        'مرتديلا': 'Mortadella', 'اندومي': 'Indomie', 'عصير': 'Saft', 'مشروب': 'Getränk',
        'بسكويت': 'Kekse', 'شيبس': 'Chips', 'ارز': 'Reis', 'رز': 'Reis',
        'مخلل': 'Eingelegtes', 'طحينه': 'Tahini', 'دبس': 'Sirup', 'رمان': 'Granatapfel',
        'حمص': 'Kichererbsen', 'فول': 'Fava Bohnen', 'معمول': 'Maamoul',
        'سردين': 'Sardinen', 'تونه': 'Thunfisch', 'ملوخيه': 'Molokhia', 'لبنه': 'Labneh',
        'سجق': 'Sucuk', 'قشطه': 'Kashta (Rahm)', 'باميه': 'Okra', 'بازلاء': 'Erbsen',
        'بازيلاء': 'Erbsen', 'فاصوليا': 'Bohnen', 'كنافه': 'Kunafa', 'عجين': 'Teig',
        'رقايق': 'Teigblätter', 'مجمد': 'Tiefgefroren', 'مقشور': 'Geschält',
        'تركي': 'Türkisch', 'عربي': 'Arabisch', 'بيضاء': 'Weiß', 'شلل': 'Flechtkäse',
        'سمنه': 'Ghee', 'زيرو': 'Zero', 'خضراء': 'Grün', 'جزر': 'Karotten',
        'اكسترا': 'Extra', 'حب': 'Ganz', 'مفروم': 'Gehackt', 'ناعم': 'Fein', 'خشن': 'Grob',
        'طازج': 'Frisch', 'معلب': 'In Dosen', 'حار': 'Scharf', 'حلو': 'Süß', 'كامل': 'Voll',
        'دسم': 'Fett', 'مطحون': 'Gemahlen', 'مجفف': 'Getrocknet', 'دجاج': 'Hähnchen',
        'لحم': 'Fleisch', 'مياه': 'Wasser', 'طحين': 'Mehl', 'سكر': 'Zucker', 'ملح': 'Salz',
        'مكسرات': 'Nüsse'
    };

    const arabicToLatinMap = {
        'ا': 'a', 'أ': 'a', 'إ': 'e', 'آ': 'a', 'ب': 'b', 'ت': 't', 'ث': 'th',
        'ج': 'j', 'ح': 'h', 'خ': 'kh', 'د': 'd', 'ذ': 'dh', 'ر': 'r', 'ز': 'z',
        'س': 's', 'ش': 'sh', 'ص': 's', 'ض': 'd', 'ط': 't', 'ظ': 'z', 'ع': 'a',
        'غ': 'gh', 'ف': 'f', 'ق': 'q', 'ك': 'k', 'ل': 'l', 'م': 'm', 'ن': 'n',
        'ه': 'h', 'ة': 'h', 'و': 'w', 'ي': 'i', 'ى': 'a', 'ئ': 'e', 'ؤ': 'o'
    };

    const cardSizeSelect = document.getElementById('cardSizeSelect');
    const widthInput = document.getElementById('widthInput');
    const heightInput = document.getElementById('heightInput');

    cardSizeSelect.addEventListener('change', (e) => {
        if (e.target.value !== 'custom') {
            const dims = e.target.value.split(',');
            widthInput.value = dims[0];
            heightInput.value = dims[1];
        }
    });

    const sortedTranslationKeys = Object.keys(exactTranslations).sort((a, b) => b.length - a.length);

    function transliterate(text) {
        let latinText = '';
        for (let j = 0; j < text.length; j++) {
            let char = text[j];
            if (/[\u0600-\u06FF]/.test(char)) {
                latinText += arabicToLatinMap[char] !== undefined ? arabicToLatinMap[char] : char;
            } else {
                latinText += char;
            }
        }
        return latinText;
    }

    function normalizeAndStripAl(text) {
        let words = text.replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').split(/\s+/);
        let cleanWords = words.map(w => {
            if (w.startsWith('ال') && w.length > 3) {
                return w.substring(2);
            }
            return w;
        });
        return cleanWords.join(' ');
    }

    function generateGermanName(arabicName) {
        if(!arabicName) return "Orientalische Produkte";
        
        let brandMatch = arabicName.match(/\(([^)]+)\)/);
        let brandArabic = brandMatch ? brandMatch[1].trim() : "";
        let materialArabic = arabicName.replace(/\([^)]+\)/g, '').trim();

        let normMaterial = normalizeAndStripAl(materialArabic);
        let translatedMaterialWords = [];
        
        let words = normMaterial.split(/\s+/);
        for(let i=0; i<words.length; i++) {
            let w = words[i];
            
            if(i < words.length - 1) {
                let pair = w + ' ' + words[i+1];
                let foundPair = false;
                for (let key of sortedTranslationKeys) {
                    if (normalizeAndStripAl(key) === pair) {
                        translatedMaterialWords.push(exactTranslations[key]);
                        i++;
                        foundPair = true;
                        break;
                    }
                }
                if(foundPair) continue;
            }

            let found = false;
            for (let key of sortedTranslationKeys) {
                if (normalizeAndStripAl(key) === w) {
                    translatedMaterialWords.push(exactTranslations[key]);
                    found = true;
                    break;
                }
            }
        }

        let finalMaterial = translatedMaterialWords.join(' ').trim();
        
        if (!finalMaterial) {
            finalMaterial = "Orientalische Produkte";
        }

        let finalBrand = brandArabic ? transliterate(brandArabic) : "";

        let result = finalMaterial;
        if (finalBrand) {
            result = result === "Orientalische Produkte" ? `(${finalBrand})` : `${result} (${finalBrand})`;
        }
        
        result = result.replace(/\s+/g, ' ').trim();
        let formattedResult = result.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
        
        return formattedResult;
    }

    const excelFileInput = document.getElementById('excelFile');
    const generateBtn = document.getElementById('generateBtn');
    const selectAllCheckbox = document.getElementById('selectAllCheckbox');
    const selectionContainer = document.getElementById('selectionContainer');
    const productList = document.getElementById('productList');

    excelFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        const isCSV = file.name.toLowerCase().endsWith('.csv');

        reader.onload = function(e) {
            try {
                let workbook;
                if (isCSV) {
                    const text = e.target.result;
                    workbook = XLSX.read(text, { type: 'string' });
                } else {
                    const data = new Uint8Array(e.target.result);
                    workbook = XLSX.read(data, { type: 'array' });
                }
                
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                parsedExcelData = XLSX.utils.sheet_to_json(worksheet, { defval: "", raw: false });
                
                if (parsedExcelData.length === 0) {
                    alert('الملف فارغ أو غير صالح!');
                    selectionContainer.style.display = 'none';
                    generateBtn.disabled = true;
                    return;
                }

                renderProductList(parsedExcelData);

            } catch (err) {
                console.error(err);
                alert('حدث خطأ أثناء قراءة الملف.');
                selectionContainer.style.display = 'none';
                generateBtn.disabled = true;
            }
        };

        if (isCSV) {
            reader.readAsText(file, 'UTF-8');
        } else {
            reader.readAsArrayBuffer(file);
        }
    });

    function renderProductList(data) {
        productList.innerHTML = '';
        selectionContainer.style.display = 'block';
        generateBtn.disabled = false;
        selectAllCheckbox.checked = true;

        data.forEach((row, index) => {
            // إضافة دعم كامل لأعمدة ملفك (name و price)
            let name = row['Produkt'] || row['الاسم (عربي)'] || row['الاسم'] || row['name'] || `منتج غير معروف (${index + 1})`;
            let price = row['Preis'] || row['السعر الأساسي'] || row['السعر'] || row['price'] || '';

            const item = document.createElement('div');
            item.className = 'product-item';
            item.innerHTML = `
                <label>
                    <input type="checkbox" class="product-cb" value="${index}" checked>
                    <span style="flex: 1; font-weight: bold; color: #1e293b;">${name}</span>
                    <span style="font-weight: bold; color: #d32f2f;" dir="ltr">${price ? price + ' €' : ''}</span>
                </label>
            `;
            productList.appendChild(item);
        });

        const checkboxes = document.querySelectorAll('.product-cb');
        checkboxes.forEach(cb => {
            cb.addEventListener('change', () => {
                const allChecked = document.querySelectorAll('.product-cb:checked').length === checkboxes.length;
                selectAllCheckbox.checked = allChecked;
            });
        });
    }

    selectAllCheckbox.addEventListener('change', (e) => {
        const checkboxes = document.querySelectorAll('.product-cb');
        checkboxes.forEach(cb => cb.checked = e.target.checked);
    });

    function formatWeight(w) {
        if (!w) return '';
        let western = String(w).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
        const stkKeywords = ['ظرف', 'قطعه', 'قطعة', 'حبه', 'حبة', 'حبات', 'قطع', 'كيس', 'اكياس'];
        let isStuck = false;
        for (let i = 0; i < stkKeywords.length; i++) {
            if (western.includes(stkKeywords[i])) { isStuck = true; break; }
        }
        let numMatch = western.match(/[\d.,]+/);
        if (!numMatch) return western; 
        let num = numMatch[0];
        if (isStuck) return `${num} Stk`;
        
        let unit = 'g';
        let lower = western.toLowerCase();
        
        if (lower.includes('ml') || lower.includes('مل')) unit = 'ml';
        else if (lower.includes('l') || lower.includes('لتر') || lower.includes('ل')) unit = 'L';
        else if (lower.includes('kg') || lower.includes('كيلو') || lower.includes('كغ')) unit = 'kg';
        else if (lower.includes('g') || lower.includes('gr') || lower.includes('غرام') || lower.includes('جرام') || lower.includes('غ') || lower.includes('جر')) unit = 'g';
        
        return `${num} ${unit}`;
    }

    function cleanPriceVal(val) {
        if (val === undefined || val === null || val === '') return '';
        let cleaned = String(val).replace(/[^\d.,]/g, '').replace(',', '.');
        let num = parseFloat(cleaned);
        return isNaN(num) ? '' : num.toFixed(2).replace('.', ',');
    }

    function calculateGrundpreis(priceStr, weightStr) {
        if (!priceStr || !weightStr) return '';
        let cleanPrice = parseFloat(String(priceStr).replace(/[^\d.,]/g, '').replace(',', '.'));
        if (isNaN(cleanPrice) || cleanPrice === 0) return '';
        
        let wLower = String(weightStr).toLowerCase().trim();
        if (wLower.includes('stk')) return ''; 
        
        let numMatch = wLower.match(/([\d.,]+)/);
        if (!numMatch) return '';
        let val = parseFloat(numMatch[1].replace(',', '.'));
        if (isNaN(val) || val === 0) return '';
        
        let unit = '';
        if (wLower.includes('kg') || wLower.includes('كيلو')) unit = 'kg';
        else if (wLower.includes('g') || wLower.includes('gr') || wLower.includes('غ')) unit = 'g';
        else if (wLower.includes('ml') || wLower.includes('مل')) unit = 'ml';
        else if (wLower.includes('l') || wLower.includes('لتر')) unit = 'l';
        else return '';

        let totalKgOrL = 0;
        let targetUnit = 'Kg';
        
        if (unit === 'g') { totalKgOrL = val / 1000; targetUnit = 'Kg'; }
        else if (unit === 'kg') { totalKgOrL = val; targetUnit = 'Kg'; }
        else if (unit === 'ml') { totalKgOrL = val / 1000; targetUnit = 'L'; }
        else if (unit === 'l') { totalKgOrL = val; targetUnit = 'L'; }
        
        if (totalKgOrL > 0) {
            let grundPrice = (cleanPrice / totalKgOrL).toFixed(2);
            return `${grundPrice.replace('.', ',')} €/${targetUnit}`;
        }
        return '';
    }

    generateBtn.addEventListener('click', () => {
        const checkedBoxes = document.querySelectorAll('.product-cb:checked');
        const selectedData = Array.from(checkedBoxes).map(cb => parsedExcelData[cb.value]);

        if (selectedData.length === 0) {
            alert('الرجاء تحديد منتج واحد على الأقل للطباعة!');
            return;
        }

        const a4_w = 210; 
        const a4_h = 297; 
        const pageMargin = 5; 
        const gap = 5; 
        
        const tw_cm = parseFloat(widthInput.value) || 7;
        const th_cm = parseFloat(heightInput.value) || 4.5;
        const tw = tw_cm * 10; 
        const th = th_cm * 10; 

        const fontScale = Math.min(tw_cm / 7, th_cm / 4.5);
        const usableW = a4_w - (pageMargin * 2);
        const usableH = a4_h - (pageMargin * 2);

        let cols = Math.floor((usableW + gap) / (tw + gap));
        let rows = Math.floor((usableH + gap) / (th + gap));
        
        if (cols < 1) cols = 1; 
        if (rows < 1) rows = 1;
        const ticketsPerPage = cols * rows;

        const styleId = "dynamic-print-style";
        let styleEl = document.getElementById(styleId);
        if (!styleEl) {
            styleEl = document.createElement('style');
            styleEl.id = styleId;
            document.head.appendChild(styleEl);
        }

        styleEl.innerHTML = `
            @media print {
                @page { size: A4 portrait; margin: 0; }
                .print-page {
                    width: 210mm;
                    height: 296mm;
                    padding: ${pageMargin}mm;
                    box-sizing: border-box;
                    display: grid;
                    grid-template-columns: repeat(${cols}, ${tw}mm);
                    grid-template-rows: repeat(${rows}, ${th}mm);
                    gap: ${gap}mm;
                    page-break-after: always;
                    break-after: page;
                    align-content: start;
                    justify-content: start;
                }
                .print-page:last-child {
                    page-break-after: auto;
                    break-after: auto;
                }
                .ticket-box {
                    width: ${tw}mm;
                    height: ${th}mm;
                    box-sizing: border-box;
                    overflow: hidden;
                    border: 2px solid #000000;
                    display: flex;
                    flex-direction: column;
                    justify-content: space-between;
                    padding: ${3 * fontScale}mm ${4 * fontScale}mm;
                    background: #fff;
                }
            }
        `;

        const printArea = document.getElementById('printArea');
        printArea.innerHTML = '';
        let currentA4Page = null;

        selectedData.forEach((row, index) => {
            if (index % ticketsPerPage === 0) {
                currentA4Page = document.createElement('div');
                currentA4Page.className = 'print-page';
                printArea.appendChild(currentA4Page);
            }

            // إضافة دعم كامل لأعمدة ملفك (name, price, offer, Unnamed: 4 للوزن)
            let arabicName = row['Produkt'] || row['الاسم (عربي)'] || row['الاسم'] || row['name'] || '';
            let weightRaw = row['Beschreibung'] || row['الوزن'] || row['Unnamed: 4'] || '';
            let barcode = row['Barcode'] || row['الباركود'] || row['barcode'] || '';
            let basePriceRaw = row['Preis'] || row['السعر الأساسي'] || row['السعر'] || row['price'] || '';
            let offerPriceRaw = row['سعر العرض'] || row['Offer Price'] || row['Angebotspreis'] || row['offer'] || '';
            
            let latinName = row['الاسم (ألماني/لاتيني)'] || generateGermanName(arabicName);

            const weight = formatWeight(weightRaw);
            const hasOffer = offerPriceRaw !== undefined && offerPriceRaw !== null && String(offerPriceRaw).trim() !== "" && String(offerPriceRaw).trim() !== "NaN" && String(offerPriceRaw).trim() !== "nan";
            const boxBgColor = hasOffer ? '#7f1d1d' : '#1e293b'; 
            
            const mainPriceNum = hasOffer ? cleanPriceVal(offerPriceRaw) : cleanPriceVal(basePriceRaw);
            const oldPriceNum = hasOffer ? cleanPriceVal(basePriceRaw) : '';
            const grundpreisText = calculateGrundpreis(mainPriceNum, weight);

            const ticketDiv = document.createElement('div');
            ticketDiv.className = 'ticket-box';

            const fontScale = Math.min(tw_cm / 7, th_cm / 4.5);

            let contentHTML = `
                <div style="display: flex; justify-content: space-between; align-items: flex-start; flex: 1; overflow: hidden; margin-bottom: ${3 * fontScale}px;">
                    <div style="font-weight: bold; color: #111; text-align: left; max-width: 65%;">
                        <div style="color: #111; direction: rtl; text-align: right; font-weight: bold; font-size: ${13 * fontScale}px; line-height: 1.1;">${arabicName}</div>
                        <div style="font-weight: bold; font-size: ${12 * fontScale}px; direction: ltr; text-align: left; line-height: 1.1; margin-top: 2px;">${latinName}</div>
                        <div style="font-size: ${11 * fontScale}px; color: #333; font-weight: bold; direction: ltr; text-align: left; margin-top: 2px;">${weight}</div>
                    </div>
                    
                    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">
                        <div style="background-color: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 3px; padding: ${2 * fontScale}px ${4 * fontScale}px; font-size: ${8 * fontScale}px; font-weight: bold; color: #334155; white-space: nowrap;">
                            Nogoom Markt
                        </div>
                        ${grundpreisText ? `<div style="font-size: ${9 * fontScale}px; color: #475569; font-weight: bold; direction: ltr; white-space: nowrap;">${grundpreisText}</div>` : ''}
                    </div>
                </div>

                <div style="position: relative; background-color: ${boxBgColor} !important; color: #ffffff !important; padding: 0; display: flex; justify-content: center; align-items: center; border-radius: 4px; flex: 0 0 calc(48px * ${fontScale}); height: calc(48px * ${fontScale}); overflow: hidden; -webkit-print-color-adjust: exact; print-color-adjust: exact;">
                    ${oldPriceNum ? `<div style="position: absolute; left: ${8 * fontScale}px; font-size: ${16 * fontScale}px; text-decoration: line-through; color: #fca5a5; font-weight: bold;" dir="ltr">${oldPriceNum} €</div>` : ''}
                    
                    <div style="font-size: ${48 * fontScale}px; font-weight: bold; letter-spacing: -1px; line-height: 1; color: #ffffff !important;" dir="ltr">
                        ${mainPriceNum ? `${mainPriceNum} <span style="font-size:${28 * fontScale}px; color: #ffffff !important;">€</span>` : ''}
                    </div>
                </div>

                <div style="display: flex; justify-content: center; align-items: center; flex: 0 0 auto; margin-top: ${3 * fontScale}px; height: ${24 * fontScale}px; overflow: hidden;">
                    <div style="width: 100%; display: flex; justify-content: center; align-items: center; height: 100%;">
                        <svg id="barcode-${index}" style="max-height: 100%; width: auto;"></svg>
                    </div>
                </div>
            `;
            
            ticketDiv.innerHTML = contentHTML;
            currentA4Page.appendChild(ticketDiv);

            setTimeout(() => {
                try {
                    if (barcode) {
                        JsBarcode(`#barcode-${index}`, String(barcode), {
                            format: "CODE128",
                            displayValue: true,
                            fontSize: 10 * fontScale,
                            height: 20 * fontScale,
                            margin: 0
                        });
                    }
                } catch (err) {
                    console.error("Barcode error:", err);
                }
            }, 100);
        });

        setTimeout(() => {
            window.print();
        }, 800);
    });
</script>

</body>
</html>
