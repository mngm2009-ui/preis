<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد ملصقات الإكسل (طباعة مباشرة تدعم العربية)</title>
    <!-- مكتبة قراءة الإكسل -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: var(--primary);
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="file"], input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: #fff;
        }

        .dimensions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .info-box {
            background: #e0f2fe;
            color: #0369a1;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        /* تنسيق خاص بصفحة الطباعة والـ PDF */
        #printArea {
            display: none;
        }

        @media print {
            body * {
                visibility: hidden;
            }
            #printArea, #printArea * {
                visibility: visible;
            }
            #printArea {
                display: block;
                position: absolute;
                top: 0;
                right: 0;
                width: 100%;
            }
            .ticket-page {
                page-break-after: always;
                break-after: page;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: flex-start;
                padding: 10mm;
            }
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <h1>مولد ملصقات الإكسل (طباعة PDF عربية 100%)</h1>
    
    <div class="info-box">
        <strong>طريقة التشغيل الذكية:</strong> ارفع ملف الإكسل، حدد الأبعاد، ثم اضغط على زر <strong>"عرض وتجهيز الملصقات للطباعة"</strong>. ستفتح لك نافذة الطباعة الخاصة بمتصفحك، اختر منها <strong>"حفظ كـ PDF" (Save as PDF)</strong> وسيعمل الخط العربي وبدون أي أخطاء نهائياً!
    </div>

    <div class="form-group">
        <label for="excelFile">اختر ملف Excel (.xlsx أو .csv):</label>
        <input type="file" id="excelFile" accept=".xlsx, .xls, .csv">
    </div>

    <div class="dimensions-grid">
        <div class="form-group">
            <label for="widthInput">عرض التكت (مليمتر):</label>
            <input type="number" id="widthInput" value="100" min="10">
        </div>
        <div class="form-group">
            <label for="heightInput">ارتفاع التكت (مليمتر):</label>
            <input type="number" id="heightInput" value="150" min="10">
        </div>
    </div>

    <button class="btn" id="generateBtn" disabled>عرض وتجهيز الملصقات للطباعة / حفظ PDF</button>
</div>

<!-- منطقة الطباعة المخفية التي تتحول لملف PDF -->
<div id="printArea"></div>

<script>
    let excelData = [];
    let tableHeaders = [];

    const excelFileInput = document.getElementById('excelFile');
    const generateBtn = document.getElementById('generateBtn');

    excelFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                excelData = XLSX.utils.sheet_to_json(worksheet, { defval: "", raw: false });
                
                if (excelData.length === 0) {
                    alert('ملف الإكسل فارغ أو غير صالح!');
                    generateBtn.disabled = true;
                    return;
                }

                tableHeaders = Object.keys(excelData[0]);
                generateBtn.disabled = false;
                alert(`تم قراءة الملف بنجاح! عدد الصفوف: ${excelData.length}`);
            } catch (err) {
                console.error(err);
                alert('حدث خطأ أثناء قراءة الملف.');
                generateBtn.disabled = true;
            }
        };
        reader.readAsArrayBuffer(file);
    });

    generateBtn.addEventListener('click', () => {
        if (excelData.length === 0) return;

        const width = document.getElementById('widthInput').value;
        const height = document.getElementById('heightInput').value;
        const printArea = document.getElementById('printArea');
        
        printArea.innerHTML = '';

        // بناء محتوى كل تكت ليكون في صفحة مستقلة عند الطباعة
        excelData.forEach((row, index) => {
            const pageDiv = document.createElement('div');
            pageDiv.className = 'ticket-page';
            pageDiv.style.width = width + 'mm';
            pageDiv.style.height = height + 'mm';
            pageDiv.style.boxSizing = 'border-box';
            pageDiv.style.border = '1px dashed #ccc'; // إطار اختياري لحدود التكت
            pageDiv.style.margin = '0 auto';
            pageDiv.style.background = '#fff';
            pageDiv.style.overflow = 'hidden';
            pageDiv.style.position = 'relative';
            
            let contentHTML = `<div style="padding: 5mm; width: 100%;">`;
            tableHeaders.forEach(header => {
                const val = row[header];
                contentHTML += `
                    <div style="margin-bottom: 8px;">
                        <span style="font-size: 11px; color: #666; display: block; font-weight: bold;">${header}:</span>
                        <span style="font-size: 14px; color: #111; display: block; font-weight: bold;">${val}</span>
                    </div>
                `;
            });
            contentHTML += `</div>`;
            
            pageDiv.innerHTML = contentHTML;
            printArea.appendChild(pageDiv);
        });

        // فتح نافذة طباعة المتصفح
        window.print();
    });
</script>

</body>
</html>
